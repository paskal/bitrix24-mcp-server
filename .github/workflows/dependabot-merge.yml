name: dependabot-merge

# Merges ready Dependabot pull requests; the rules are in the script.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      MIN_RELEASE_AGE_DAYS: "3"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Merge ready Dependabot pull requests
        run: .github/scripts/dependabot-merge.sh
